<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>MMD Viewer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="app">
    <canvas id="viewport" aria-label="MMD 3D viewport"></canvas>
    <div id="dropZone">
      <strong>モデルのフォルダーをドロップ</strong>
      <span>PMX / PMD、VMD、音声、テクスチャをまとめて読み込みます</span>
    </div>

    <header class="topbar surface">
      <div class="brand">
        <span class="brandMark">M</span>
        <div><b>MMD Viewer</b><small>Three.js renderer</small></div>
      </div>
      <div class="actions">
        <button id="resetCamera" type="button">カメラを戻す</button>
        <button id="openFiles" type="button">ファイル</button>
        <button id="openFolder" type="button" class="primary">フォルダーを開く</button>
        <input id="fileInput" type="file" multiple hidden>
        <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
      </div>
    </header>

    <aside class="panel surface">
      <section>
        <h2>再生</h2>
        <div class="transport">
          <button id="playButton" type="button" class="round" aria-label="再生">▶</button>
          <span id="timeLabel">0:00.00 / 0:00.00</span>
        </div>
        <input id="timeline" type="range" min="0" max="0.001" step="0.001" value="0">
      </section>

      <section class="options">
        <label><input id="edgeToggle" type="checkbox" checked> 輪郭線</label>
        <label><input id="cameraToggle" type="checkbox" checked> VMDカメラ</label>
        <label><input id="loopToggle" type="checkbox" checked> ループ</label>
        <label class="selectLabel">解像度
          <select id="scaleSelect">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
          </select>
        </label>
      </section>

      <section>
        <h2>モデル</h2>
        <div id="modelName" class="modelName">未読込</div>
        <dl id="modelStats">
          <div><dt>頂点</dt><dd>—</dd></div>
          <div><dt>ボーン</dt><dd>—</dd></div>
          <div><dt>モーフ</dt><dd>—</dd></div>
          <div><dt>剛体</dt><dd>—</dd></div>
        </dl>
      </section>

      <section>
        <h2>実行状態</h2>
        <div class="meter"><span>FPS</span><strong id="fps">0</strong></div>
        <div class="meter"><span>Frame</span><strong id="frameLabel">0.0</strong></div>
        <p id="status">初期化しています。</p>
      </section>
    </aside>

    <div class="help surface">左ドラッグ: 回転　右ドラッグ: 移動　ホイール: ズーム</div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
