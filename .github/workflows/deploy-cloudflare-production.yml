name: Deploy Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-production.yml'
      - 'payload/**'
      - 'runtime-patch/**'
      - 'production-deploy.trigger'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Reconstruct and validate deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* > mmd-dist.tar.gz.b64
          base64 --decode mmd-dist.tar.gz.b64 > mmd-dist.tar.gz
          echo "9729a92e188e1b20da7a9d201504317da7e1444f116a637d5fa43ba0d0ec493a  mmd-dist.tar.gz" | sha256sum --check --strict
          tar -xzf mmd-dist.tar.gz

          # Use the stable WebGPU entry point from the bundle. The previous
          # runtime patch imported a WebGL file that was not shipped.
          python3 - <<'PY'
          from pathlib import Path

          main = Path('dist/src/main.js')
          source = main.read_text(encoding='utf-8')
          needle = '    state.core.load(model, motion);'
          guard = "    if (!state.core || !state.renderer) throw new Error('描画エンジンの初期化が完了していません。ページを再読み込みしてください。');\n" + needle
          if needle in source and '描画エンジンの初期化が完了していません' not in source:
              source = source.replace(needle, guard, 1)
          main.write_text(source, encoding='utf-8')

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          if 'rel="icon"' not in html:
              html = html.replace('<head>', '<head>\n  <link rel="icon" href="./favicon.svg" type="image/svg+xml">', 1)
          index.write_text(html, encoding='utf-8')
          PY

          cat > dist/favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="12" fill="#111827"/>
            <path d="M14 47V17h9l9 17 9-17h9v30h-8V30L35 43h-6l-7-13v17z" fill="#f8fafc"/>
          </svg>
          SVG

          cat > dist/_headers <<'HEADERS'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
            Cross-Origin-Resource-Policy: same-origin
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
            Permissions-Policy: camera=(), microphone=(), geolocation=()

          /public/mmd_core.wasm
            Cache-Control: public, max-age=3600, must-revalidate
          HEADERS

          node --check dist/src/main.js
          test -f dist/index.html
          test -f dist/src/main.js
          test -f dist/favicon.svg
          test -f dist/public/mmd_core.wasm
          test -f wrangler.jsonc
          ! grep -q 'webgl-renderer.js' dist/src/main.js

      - name: Deploy to selected Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: 'true'
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.102.0 deploy 2>&1 | tee deploy-production.log

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-deploy-log
          path: deploy-production.log
          if-no-files-found: warn
          retention-days: 7
