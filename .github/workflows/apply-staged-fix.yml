name: Apply staged motion stabilization

on:
  push:
    branches:
      - automation/stabilize-motion-20260728

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.staging/chunk-00') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/chunk-* > /tmp/mmder-payload.b64
          base64 --decode /tmp/mmder-payload.b64 > /tmp/mmder-payload.tar.gz
          tar -xzf /tmp/mmder-payload.tar.gz
      - name: Validate source and distribution
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          git diff --check
      - name: Commit reconstructed files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging .github/workflows/apply-staged-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src dist
          git add -u .staging .github/workflows/apply-staged-fix.yml
          git commit -m "Reconstruct stabilized motion and physics files"
          git push origin HEAD
