name: Apply verified motion stabilization

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/chunk-* > /tmp/mmder-payload.b64
          base64 --decode /tmp/mmder-payload.b64 > /tmp/mmder-payload.tar.gz
          tar -xzf /tmp/mmder-payload.tar.gz
      - name: Validate source and distribution
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-package-lock
          npm run check
          git diff --check
      - name: Commit validated files and clean staging
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging .github/workflows/apply-staged-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- src dist .staging .github/workflows/apply-staged-fix.yml
          git commit -m "Stabilize living motion, rendering, pulling, and physics"
          git push origin HEAD:main
