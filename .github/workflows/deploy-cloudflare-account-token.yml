name: Deploy Cloudflare Account Token

on:
  pull_request:
    branches: [main]
    paths:
      - 'account-deploy.trigger'

permissions:
  contents: write

concurrency:
  group: cloudflare-account-token-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate one-time transfer key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/cf-account-transfer"
          mkdir -p "$KEY_DIR" .cf-account-transfer
          : > account-deploy-status.log
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$KEY_DIR/private.pem"
          openssl pkey -in "$KEY_DIR/private.pem" -pubout -out .cf-account-transfer/public.pem
          chmod 600 "$KEY_DIR/private.pem"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cf-account-transfer/public.pem
          git commit -m 'Publish one-time account token transfer key'
          git push origin HEAD:main
          echo 'phase=public_key_published' >> account-deploy-status.log

      - name: Receive credentials and deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/cf-account-transfer"
          SECRET_JSON="$KEY_DIR/credentials.json"
          CIPHER_BIN="$KEY_DIR/credentials.bin"
          API_JSON="$KEY_DIR/api-response.json"
          STATUS_LOG="$GITHUB_WORKSPACE/account-deploy-status.log"
          trap 'rm -rf "$KEY_DIR"' EXIT
          diag() { printf '%s\n' "$1" | tee -a "$STATUS_LOG"; }
          fail() { diag "failure=$1"; exit 1; }

          found=0
          code=000
          for attempt in $(seq 1 150); do
            code=$(curl -sS -o "$API_JSON" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.cf-account-transfer/payload.b64?ref=main")
            if [ "$code" = '200' ]; then
              jq -r '.content' "$API_JSON" | tr -d '\n' | base64 --decode | base64 --decode > "$CIPHER_BIN"
              found=1
              break
            fi
            sleep 5
          done
          diag "payload_http=$code"
          test "$found" = '1' || fail encrypted_payload_missing

          openssl pkeyutl -decrypt \
            -inkey "$KEY_DIR/private.pem" \
            -in "$CIPHER_BIN" \
            -out "$SECRET_JSON" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 || fail credential_decryption_failed
          diag 'phase=credentials_decrypted'

          CLOUDFLARE_ACCOUNT_ID=$(jq -er '.account_id' "$SECRET_JSON")
          CLOUDFLARE_API_TOKEN=$(jq -er '.api_token' "$SECRET_JSON")
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN

          cat payload/part-* > mmd-dist.tar.gz.b64
          base64 --decode mmd-dist.tar.gz.b64 > mmd-dist.tar.gz
          archive_sha=$(sha256sum mmd-dist.tar.gz | awk '{print $1}')
          test "$archive_sha" = '9729a92e188e1b20da7a9d201504317da7e1444f116a637d5fa43ba0d0ec493a' || fail archive_checksum_mismatch
          tar -xzf mmd-dist.tar.gz
          test -f dist/index.html || fail dist_index_missing
          test -f dist/public/mmd_core.wasm || fail wasm_missing
          test -f runtime-patch/main.js || fail runtime_patch_missing
          if grep -qE '(\./|/)public/main\.js' dist/index.html; then
            PATCH_DEST='dist/public/main.js'
          elif grep -qE '(\./|/)src/main\.js' dist/index.html; then
            PATCH_DEST='dist/src/main.js'
          elif test -f dist/public/main.js; then
            PATCH_DEST='dist/public/main.js'
          else
            PATCH_DEST='dist/src/main.js'
          fi
          cp runtime-patch/main.js "$PATCH_DEST"
          node --check "$PATCH_DEST"
          diag "patch_destination=$PATCH_DEST"
          diag 'phase=bundle_verified'

          token_status=$(curl -sS -o account-token-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" || true)
          diag "account_token_verify_http=$token_status"
          jq -c '{success, status: (.result.status // null), errors: [.errors[]? | {code, message}]}' account-token-verify.json 2>/dev/null | tee -a "$STATUS_LOG" || true
          test "$token_status" = '200' || fail account_token_verify_http
          jq -e '.success == true and .result.status == "active"' account-token-verify.json >/dev/null || fail account_token_inactive
          diag 'phase=account_token_active'

          diag 'phase=wrangler_deploy_started'
          npx --yes wrangler@4.102.0 deploy 2>&1 | tee deploy-production.log
          diag 'phase=wrangler_deploy_completed'

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-account-production-log
          path: |
            account-deploy-status.log
            deploy-production.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove transfer files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm -f --ignore-unmatch .cf-account-transfer/public.pem .cf-account-transfer/payload.b64
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove one-time account token transfer files'
            git push origin HEAD:main
          fi
